  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Amora Florals</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FBF6F3;
    }
    #amora-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#FBF6F3, #F5E6E4);
      color: #C97B85;

    }
    #amora-splash .name {
      font-size: 44px;
    }
    #amora-splash .sub {

      font-family: system-ui, sans-serif;

      color: #9A7F82;
    }
  </style>

<body>
  <!-- Visible immediately, before the Flutter engine finishes downloading. -->
  <div id="amora-splash">
    <div class="name">Amora Florals</div>
    <div class="sub">Preparing your bouquets…</div>
  </div>
  <script>
    // Drop the old sample-chat app that Safari kept in a service worker.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20261003-landing4" async></script>
</body>
