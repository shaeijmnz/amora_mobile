<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amora Florals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #e8979e;
      --rose-deep: #c97b85;
      --blush: #f0c4c8;
      --cream: #fbf6f3;
      --terracotta: #c47a5a;
      --ink: #4a3538;
      --mist: #9a7f82;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Quicksand, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fbf6f3 0%, #f5e6e4 55%, #efd6d4 100%);
    }
    .spark {
      position: fixed;
      color: #e8b4b8;
      font-size: 14px;
      pointer-events: none;
      opacity: 0.7;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 22px;
    }
    .story {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep) 55%, var(--terracotta));
      box-shadow: 0 10px 24px rgba(201, 123, 133, 0.28);
      font-size: 24px;
    }
    h1 {
      font-family: Allura, cursive;
      font-weight: 400;
      font-size: 60px;
      line-height: 0.9;
      color: var(--rose-deep);
      margin: 6px 0 0;
    }
    .florals {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 20px;
      margin-top: -4px;
    }
    .glass {
      width: 100%;
      margin-top: 14px;
      background: rgba(255, 251, 248, 0.92);
      border: 1px solid var(--blush);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(201, 123, 133, 0.1);
      padding: 12px 14px 4px;
      text-align: left;
    }
    .point {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-bottom: 8px;
    }
    .point .icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      background: rgba(240, 196, 200, 0.55);
      color: var(--rose-deep);
      font-size: 15px;
    }
    .point strong { display: block; font-family: "Cormorant Garamond", serif; font-size: 16px; font-weight: 600; }
    .point span { display: block; color: var(--mist); font-size: 12px; line-height: 1.25; }
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    a.btn {
      height: 52px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }
    a.primary {
      color: #fff;
      background: linear-gradient(135deg, #e8979e, #c97b85 55%, #c47a5a);
    }
    a.ghost {
      color: var(--rose-deep);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--blush);
    }
    @media (min-width: 860px) {
      .wrap { padding: 28px 22px; }
      .mark { width: 64px; height: 64px; font-size: 28px; }
      h1 { font-size: 76px; }
      .florals { font-size: 24px; }
      .glass { margin-top: 18px; }
      .actions { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <span class="spark" style="top: 8%; left: 12%;">✦</span>
  <span class="spark" style="top: 18%; right: 16%;">✦</span>
  <span class="spark" style="bottom: 14%; left: 20%;">+</span>
  <span class="spark" style="bottom: 10%; right: 18%;">✦</span>
  <main class="wrap">
    <section class="story">
      <div class="mark" aria-hidden="true">✿</div>
      <h1>Amora</h1>
      <div class="florals">Florals</div>
      <div class="glass">
        <article class="point">
          <div class="icon">✿</div>
          <div>
            <strong>Order</strong>
            <span>Choose a bouquet from the shop.</span>
          </div>
        </article>
        <article class="point">
          <div class="icon">▦</div>
          <div>
            <strong>Delivery</strong>
            <span>Set the date and the time.</span>
          </div>
        </article>
        <article class="point">
          <div class="icon">✉</div>
          <div>
            <strong>Message</strong>
            <span>Write the admin in one thread.</span>
          </div>
        </article>
      </div>
      <div class="actions">
        <a class="btn primary" href="/">Log in</a>
        <a class="btn ghost" href="/">Create account</a>
      </div>
    </section>
  </main>
</body>
</html>
